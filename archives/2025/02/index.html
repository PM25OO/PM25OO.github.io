<div id="floating-player">

        <svg viewBox="0 0 24 24" class="icon play-icon">
            <path d="M8 5v14l11-7z"/>

        </svg>
    </button>
    <button class="control-btn" id="next-btn" onclick="nextSong()" title="下一首" aria-label="下一首">

    </button>
  </div>
  <input type="range" id="progress-bar" min="0" max="100" value="0" readonly>
  <audio id="bgm-player" preload="auto"></audio>
</div>

<script>
const playlist = [
  { title: "I Fell in Love with You at Coffee Shop", path: "/music/I Fell in Love with You at Coffee Shop.mp3" },
  { title: "MERMAID", path: "/music/MERMAID.mp3" },
  { title: "Tyndall", path: "/music/Tyndall.mp3" }
];

let index = 0;

const audio = document.getElementById('bgm-player');
const titleEl = document.getElementById('song-title');
const progressBar = document.getElementById('progress-bar');
const playPauseIcon = document.getElementById('play-pause-icon');
const playPauseButton = document.getElementById('play-pause-button');


function loadSong(i) {
  index = (i + playlist.length) % playlist.length;
  const song = playlist[index];
  audio.src = song.path;
  setSongTitle(song.title);
  audio.play();
  playPauseButton.classList.add('playing'); // 保证状态同步
}


function prevSong() {
  loadSong(index - 1);
}

function nextSong() {
  loadSong(index + 1);
}

function togglePlay() {
  if (audio.paused) {
    audio.play();
    playPauseButton.classList.add('playing');
  } else {
    audio.pause();
    playPauseButton.classList.remove('playing');
  }
}

function setSongTitle(newTitle) {
  // 先淡出
  titleEl.style.opacity = '0';
  setTimeout(() => {
    titleEl.innerText = newTitle; // 改文本
    titleEl.style.opacity = '1';  // 淡入
  }, 400); // 跟 CSS transition 时间一致
}

function updatePlayIcon() {
  playPauseIcon.innerHTML = audio.paused
    ? '<path d="M8 5v14l11-7z"/>'
    : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
}

audio.addEventListener('ended', () => {
  nextSong();
});

audio.addEventListener('timeupdate', () => {
  const percent = (audio.currentTime / audio.duration) * 100 || 0;
  progressBar.value = percent;
  progressBar.style.setProperty('--progress', percent + '%');
});

// 自动播放：首次点击网页任意处
document.addEventListener('DOMContentLoaded', function () {
  document.body.addEventListener('click', () => {
    if (!audio.src) loadSong(0);
    else audio.play();
  }, { once: true });
});

const floatingPlayer = document.getElementById('floating-player');
const controlButtons = floatingPlayer.querySelectorAll('.control-btn');

let isCollapsed = false;

floatingPlayer.addEventListener('click', (e) => {
  if (isCollapsed) {
    // 折叠状态下点击播放器任何位置展开
    expandPlayer();
    return;
  }

  // 检查点击的目标是否是控制按钮或其子元素
  const clickedElement = e.target;
  const isControlButton = clickedElement.closest('.control-btn') || 
                         clickedElement.closest('#progress-bar') ||
                         clickedElement.id === 'progress-bar';

  // 如果不是控制元素，触发折叠
  if (!isControlButton) {
    collapsePlayer();
  }
});

function collapsePlayer() {
  floatingPlayer.classList.add('collapsed');
  isCollapsed = true;
}

function expandPlayer() {
  floatingPlayer.classList.remove('collapsed');
  isCollapsed = false;
}

</script>
