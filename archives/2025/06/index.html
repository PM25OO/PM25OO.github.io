            <path d="M8 5v14l11-7z"/>

<script>
let index = 0;

const audio = document.getElementById('bgm-player');
const progressBar = document.getElementById('progress-bar');
const playPauseButton = document.getElementById('play-pause-button');
const playlistContainer = document.getElementById('playlist-container');
const playlistContent = document.getElementById('playlist-content');
const floatingPlayer = document.getElementById('floating-player');

let isCollapsed = false;
let playlistTimeout;

// 淡入函数
function fadeIn() {
  clearTimeout(fadeTimeout);
  clearInterval(fadeInterval);
  
  audio.volume = 0;
  const step = 1 / FADE_STEPS;
  let currentStep = 0;
  
  fadeInterval = setInterval(() => {
    currentStep++;
    audio.volume = Math.min(currentStep * step, 1);
    
    if (currentStep >= FADE_STEPS) {
      clearInterval(fadeInterval);
      audio.volume = 1;
    }
  }, FADE_INTERVAL);
}

// 淡出函数
function fadeOut(callback) {
  clearTimeout(fadeTimeout);
  clearInterval(fadeInterval);
  
  const startVolume = audio.volume;
  const step = startVolume / FADE_STEPS;
  let currentStep = 0;
  
  fadeInterval = setInterval(() => {
    currentStep++;
    audio.volume = Math.max(startVolume - (currentStep * step), 0);
    
    if (currentStep >= FADE_STEPS || audio.volume <= 0) {
      clearInterval(fadeInterval);
      audio.volume = 0;
      if (callback) callback();
    }
  }, FADE_INTERVAL);
}

function loadSong(i) {
  index = (i + playlist.length) % playlist.length;
  const song = playlist[index];
  
  // 如果当前有音乐在播放，先淡出再切换
  if (!audio.paused) {
    fadeOut(() => {
      audio.src = song.path;
      updatePlaylistActive();
      audio.play().then(() => {
        fadeIn();
        playPauseButton.classList.add('playing');
      });
    });
  } else {
    audio.src = song.path;
    updatePlaylistActive();
    audio.play().then(() => {
      fadeIn();
      playPauseButton.classList.add('playing');
    });
  }
}

function prevSong() {
  loadSong(index - 1);
}

function nextSong() {
  loadSong(index + 1);
}

function togglePlay() {
  if (audio.paused) {
    audio.play().then(() => {
      fadeIn();
      playPauseButton.classList.add('playing');
    });
  } else {
    fadeOut(() => {
      audio.pause();
      playPauseButton.classList.remove('playing');
    });
  }
}

// 生成播放列表
function generatePlaylist() {
  playlistContent.innerHTML = '';
  playlist.forEach((song, i) => {
    const item = document.createElement('div');
    item.className = 'playlist-item';
    item.textContent = song.title;
    item.onclick = () => loadSong(i);
    if (i === index) {
      item.classList.add('active');
    }
    playlistContent.appendChild(item);
  });
}

// 更新播放列表活跃状态
function updatePlaylistActive() {
  const items = playlistContent.querySelectorAll('.playlist-item');
  items.forEach((item, i) => {
    item.classList.toggle('active', i === index);
  });
}

// 显示播放列表
function showPlaylist() {
  if (!isCollapsed) {
    clearTimeout(playlistTimeout);
    playlistContainer.classList.add('visible');
  }
}

// 隐藏播放列表
function hidePlaylist() {
  playlistTimeout = setTimeout(() => {
    playlistContainer.classList.remove('visible');
  }, 500); // 改为0.5秒
}

// 播放器鼠标事件
floatingPlayer.addEventListener('mouseenter', showPlaylist);
floatingPlayer.addEventListener('mouseleave', hidePlaylist);

// 播放列表鼠标事件
playlistContainer.addEventListener('mouseenter', () => {
  if (!isCollapsed) {
    clearTimeout(playlistTimeout);
  }
});
playlistContainer.addEventListener('mouseleave', hidePlaylist);

// 播放器点击事件处理
floatingPlayer.addEventListener('click', (e) => {
  if (isCollapsed) {
    expandPlayer();
    return;
  }

  const clickedElement = e.target;
  const isControlButton = clickedElement.closest('.control-btn') || 
                         clickedElement.closest('#progress-bar') ||
                         clickedElement.id === 'progress-bar';

  if (!isControlButton) {
    collapsePlayer();
  }
});

function collapsePlayer() {
  floatingPlayer.classList.add('collapsed');
  playlistContainer.classList.remove('visible');
  clearTimeout(playlistTimeout);
  isCollapsed = true;
}

function expandPlayer() {
  floatingPlayer.classList.remove('collapsed');
  isCollapsed = false;
}

audio.addEventListener('ended', () => {
  nextSong();
});

audio.addEventListener('timeupdate', () => {
  const percent = (audio.currentTime / audio.duration) * 100 || 0;
  progressBar.value = percent;
  progressBar.style.setProperty('--progress', percent + '%');
});

// 初始化
document.addEventListener('DOMContentLoaded', function () {
  generatePlaylist();
  
  // 设置初始音量为0，准备淡入效果
  audio.volume = 0;
  
  document.body.addEventListener('click', () => {
    if (!audio.src) {
      loadSong(0);
    } else {
      audio.play().then(() => {
        fadeIn();
        playPauseButton.classList.add('playing');
      });
    }
  }, { once: true });
});
</script>
